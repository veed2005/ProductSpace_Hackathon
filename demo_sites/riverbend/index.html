<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta property="og:site_name" content="Riverbend Health patient portal">
  <title>MyRiverbend</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <a class="logo" href="#/">
      <svg viewBox="0 0 40 40" width="34" height="34" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="#0e7490"/><path d="M8 25c6-9 12 3 24-8" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/></svg>
      <span><b>MyRiverbend</b><small>Riverbend Health</small></span>
    </a>
    <div class="me">
      <span class="avatar" aria-hidden="true">ME</span>
      <span>Margaret Ellis</span>
      <button class="ghost" id="logout" type="button">Log out</button>
    </div>
  </header>
  <div class="shell">
    <nav class="side" aria-label="Main menu">
      <a href="#/" data-nav="home">Home</a>
      <a href="#/visits" data-nav="visits">Visits</a>
      <a href="#/messages" data-nav="messages">Messages <span class="badge" aria-label="1 unread">1</span></a>
      <a href="#/results" data-nav="results">Test Results</a>
      <a href="#/medications" data-nav="medications">Medications</a>
      <a href="#/billing" data-nav="billing">Billing</a>
    </nav>
    <main id="app" tabindex="-1"></main>
  </div>
  <footer class="foot">
    Riverbend Health is a fictional health system for demonstrations. No real patient data.
    <button class="ghost tiny" id="reset" type="button">Reset demo data</button>
  </footer>
  <script src="app.js"></script>
</body>
</html>
