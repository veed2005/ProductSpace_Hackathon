[project]
name = "formline"
version = "0.1.0"
description = "Formline: any form, any phone. Call or text to fill out forms and understand letters."
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.4",
    "anthropic>=0.60",
    "twilio>=9.0",
    "pymupdf>=1.24",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "python-multipart>=0.0.9",
    "openai>=3.24.0",
]

[dependency-groups]
dev = [
    "playwright>=1.63.0",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live: hits the real Anthropic API (run with: pytest -m live)",
]
addopts = "-m 'not live'"
filterwarnings = ["ignore::DeprecationWarning:importlib._bootstrap"]

[tool.uv]
package = false
